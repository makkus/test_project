name: 'Setup uv environment'
description: 'Checkout, install uv, Python, and sync dependencies'
inputs:
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.14'
runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: install Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}
    - name: create lockfile
      if: hashFiles('uv.lock') == ''
      shell: bash
      run: uv lock --python ${{ inputs.python-version }}
    - name: install the project
      shell: bash
      run: uv sync --locked --dev --python ${{ inputs.python-version }}
